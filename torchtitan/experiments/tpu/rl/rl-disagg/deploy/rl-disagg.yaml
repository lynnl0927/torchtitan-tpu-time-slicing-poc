# 1. Trainer Headless Service
apiVersion: v1
kind: Service
metadata:
  name: trainer-service
spec:
  clusterIP: None 
  selector:
    app: trainer
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
# 2. Sampler Headless Service
apiVersion: v1
kind: Service
metadata:
  name: sampler-service
spec:
  clusterIP: None
  selector:
    app: sampler
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
---
# 3. Trainer Job on TPU v6e
apiVersion: batch/v1
kind: Job
metadata:
  name: trainer-job
spec:
  template:
    metadata:
      labels:
        app: trainer
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 2x4  # standard for single-host 8-chip v6e
      initContainers:
      - name: download-model
        image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-rl:testcheckpoint
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - "pip install huggingface_hub && hf download Qwen/Qwen3-0.6B --local-dir /checkpoint"
        volumeMounts:
        - name: checkpoint-vol
          mountPath: /checkpoint
      containers:
      - name: trainer
        image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-rl:testcheckpoint
        imagePullPolicy: Always
        command: ["python3", "-m", "torch.distributed.run"]
        args: 
          - "--nproc_per_node=8"
          - "/app/torchtitan/torchtitan/experiments/tpu/rl/rl-disagg/server_trainer.py"
          - "--module=torchtitan.experiments.tpu.rl"
          - "--config=grpo_qwen3_0_6b_glp"
          - "--checkpoint.initial_load_path"
          - "/checkpoint"
          - "--checkpoint.initial_load_in_hf"
          - "--checkpoint.enable"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /checkpoint
          name: checkpoint-vol
        ports:
        - containerPort: 8000
        resources:
          limits:
            google.com/tpu: 8
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: checkpoint-vol
        emptyDir: {}
---
