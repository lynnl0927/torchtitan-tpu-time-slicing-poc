# 5. Orchestrator (Driver) Job on standard CPU
apiVersion: batch/v1
kind: Job
metadata:
  name: driver-job
spec:
  template:
    metadata:
      labels:
        app: driver
    spec:
      restartPolicy: Never
      # Runs on a standard CPU node (does not request TPU)
      initContainers:
      - name: download-model
        image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-rl:testcheckpoint
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - "pip install huggingface_hub && hf download Qwen/Qwen3-0.6B --local-dir /checkpoint"
        volumeMounts:
        - name: checkpoint-vol
          mountPath: /checkpoint
      containers:
      - name: driver
        image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-rl:testcheckpoint
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args: 
          - |
            python3 -c '
            import socket, time, os
            for host, port in [(os.environ.get("TRAINER_IP", "trainer-service"), 8000), (os.environ.get("SAMPLER_IP", "sampler-service"), 8001)]:
                while True:
                    try:
                        socket.create_connection((host, port), timeout=2)
                        print(f"{host}:{port} is ready!")
                        break
                    except Exception:
                        print(f"Waiting for {host}:{port}...")
                        time.sleep(5)
            '
            python3 -u /app/torchtitan/torchtitan/experiments/tpu/rl/rl-disagg/rl_driver.py
        volumeMounts:
        - name: checkpoint-vol
          mountPath: /checkpoint
        env:
        - name: TOKENIZER_PATH
          value: "/checkpoint"
        - name: PYTHONUNBUFFERED
          value: "1"
        # DNS Service Resolution instead of hardcoded IPs
        - name: TRAINER_IP
          value: "trainer-service"
        - name: SAMPLER_IP
          value: "sampler-service"
        # Control scaling configuration directly via K8s Environment Variables
        - name: PROMPTS_PER_STEP
          value: "4"
        - name: GROUP_SIZE
          value: "4"
        - name: TRAIN_EPOCHS
          value: "32"
        - name: PROMPT_LEN
          value: "128"
        - name: ROLLOUT_BATCH_SIZE
          value: "8"
        - name: TRAIN_BATCH_SIZE
          value: "8"
      volumes:
      - name: checkpoint-vol
        emptyDir: {}
