---
apiVersion: batch/v1
kind: Job
metadata:
  name: driver-a-job
spec:
  template:
    metadata:
      labels:
        app: driver-a
    spec:
      restartPolicy: Never
      initContainers:
      - name: download-model
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
        command:
        - /bin/bash
        - -c
        args:
        - gcloud storage cp -r 'gs://linglinll-gke-dev-libtpu/models/qwen3-0.6b/*' /checkpoint/
        volumeMounts:
        - name: checkpoint-vol
          mountPath: /checkpoint
      containers:
      - name: driver
        image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-rl:libtpuv3
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - "python3 -c '\nimport socket, time, os\nfor host, port in [(os.environ.get(\"\
          TRAINER_IP\"), int(os.environ.get(\"TRAINER_PORT\"))), (os.environ.get(\"\
          SAMPLER_IP\"), int(os.environ.get(\"SAMPLER_PORT\"))), (os.environ.get(\"\
          ORCHESTRATOR_IP\"), 9000)]:\n    while True:\n        try:\n           \
          \ socket.create_connection((host, port), timeout=2)\n            print(f\"\
          {host}:{port} is ready!\")\n            break\n        except Exception:\n\
          \            print(f\"Waiting for {host}:{port}...\")\n            time.sleep(5)\n\
          '\npython3 -u /app/torchtitan/torchtitan/experiments/tpu/rl/rl-disagg/rl_driver.py\n"
        volumeMounts:
        - name: checkpoint-vol
          mountPath: /checkpoint
        env:
        - name: TOKENIZER_PATH
          value: /checkpoint
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: TRAINER_IP
          value: trainer-a-service
        - name: TRAINER_PORT
          value: '8000'
        - name: SAMPLER_IP
          value: sampler-a-service
        - name: SAMPLER_PORT
          value: '8001'
        - name: ORCHESTRATOR_IP
          value: orchestrator-service
        - name: JOB_ID
          value: job-a
        - name: PROMPTS_PER_STEP
          value: '4'
        - name: GROUP_SIZE
          value: '4'
        - name: TRAIN_EPOCHS
          value: '32'
        - name: PROMPT_LEN
          value: '128'
        - name: ROLLOUT_BATCH_SIZE
          value: '8'
        - name: TRAIN_BATCH_SIZE
          value: '8'
      volumes:
      - name: checkpoint-vol
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-rl:libtpuv3
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - 'pip install fastapi uvicorn pydantic grpcio

          python3 -u /app/torchtitan/torchtitan/experiments/tpu/rl/rl-disagg/orchestrator.py

          '
        env:
        - name: MODE
          value: baseline
        ports:
        - containerPort: 9000
