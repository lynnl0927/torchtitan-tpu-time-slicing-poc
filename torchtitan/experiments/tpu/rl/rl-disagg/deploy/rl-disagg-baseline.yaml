apiVersion: v1
kind: Service
metadata:
  name: trainer-a-service
spec:
  clusterIP: None
  selector:
    app: trainer-a
---
apiVersion: v1
kind: Service
metadata:
  name: sampler-a-service
spec:
  clusterIP: None
  selector:
    app: sampler-a
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
spec:
  clusterIP: None
  selector:
    app: orchestrator
  ports:
  - protocol: TCP
    port: 9000
    targetPort: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: trainer-a
spec:
  template:
    metadata:
      labels:
        app: trainer-a
    spec:
      containers:
      - name: trainer-a
        image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-rl:libtpuv3
        imagePullPolicy: Always
        command:
        - python3
        - -m
        - torch.distributed.run
        args:
        - --nproc_per_node=8
        - /app/torchtitan/torchtitan/experiments/tpu/rl/rl-disagg/server_trainer.py
        - --module=torchtitan.experiments.tpu.rl
        - --config=grpo_qwen3_0_6b_glp
        - --checkpoint.initial_load_path=/checkpoint
        - --checkpoint.initial_load_in_hf
        - --checkpoint.enable
        env:
        - name: TPU_LIBRARY_PATH
          value: /shared/_libtpuv3.so
        - name: LIBTPU_CHECKPOINTING_ENABLED
          value: 'on'
        - name: LIBTPU_CHECKPOINTING_USE_DMA_PIPELINE
          value: 'true'
        - name: LIBTPU_CHECKPOINTING_CHUNK_SIZE
          value: '33554432'
        - name: TPU_WORKER_HOSTNAMES
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: DEFER_INIT
          value: 'true'
        - name: ENABLE_RUNTIME_UPTIME_TELEMETRY
          value: '0'
        - name: SERVER_PORT
          value: '8000'
        - name: BROADCAST_PORT
          value: '18000'
        volumeMounts:
        - mountPath: /shared
          name: shared-libtpu
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /checkpoint
          name: checkpoint-vol
        ports:
        - containerPort: 8000
        resources:
          limits:
            google.com/tpu: 8
      initContainers:
      - name: stage-libtpu
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
        command:
        - /bin/bash
        - -c
        args:
        - gcloud storage cp gs://linglinll-gke-dev-libtpu/_libtpuv3.so /shared/_libtpuv3.so
        volumeMounts:
        - mountPath: /shared
          name: shared-libtpu
      - args:
        - gcloud storage cp -r 'gs://linglinll-gke-dev-libtpu/models/qwen3-0.6b/*' /checkpoint/
        command:
        - /bin/bash
        - -c
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
        name: download-model
        volumeMounts:
        - mountPath: /checkpoint
          name: checkpoint-vol
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
        cloud.google.com/gke-tpu-topology: 2x4
      restartPolicy: Never
      volumes:
      - emptyDir: {}
        name: shared-libtpu
      - emptyDir:
          medium: Memory
        name: dshm
      - emptyDir: {}
        name: checkpoint-vol
      - hostPath:
          path: /dev/vfio
        name: host-dev-vfio
      - hostPath:
          path: /var/run/tpu-plugin
        name: tpu-plugin-vol
---
