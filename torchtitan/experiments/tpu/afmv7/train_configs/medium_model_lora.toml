[job]
dump_folder = "./outputs"
description = "AFMTextV7 medium LoRA training"
print_config = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
profiler_warmup = 5
profiler_active = 2
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "afmv7_tpu"
flavor = "medium-lora"
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8
decay_type = "linear"
min_lr_factor = 0.0

[training]
local_batch_size = 2
seq_len = 128
max_norm = 1.0
steps = 10
dataset = "c4_test"
dtype = "bfloat16"
mixed_precision_param = "bfloat16"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
context_parallel_degree = 1

[tpu_config]
use_loss_kernel = true
use_splash_attention_kernel = true
use_graph_split = true
enable_amp = false
use_lora = true
lora_dtype = "float32"

[checkpoint]
enable = false
folder = "checkpoint"
interval = 10

[activation_checkpoint]
mode = "full"  # ["none", "full"] — uses TAMM's checkpoint_activations()

[compile]
enable = true
backend = "tpu"
components = ["model", "loss"]

[validation]
enable = false
dataset = "c4_test"
freq = 5
steps = 10
