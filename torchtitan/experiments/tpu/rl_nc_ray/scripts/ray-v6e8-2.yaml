---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-ksa 
  namespace: ray
  annotations:
      iam.gke.io/gcp-service-account: ray-tpu-gsa@tpu-pytorch.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ray-ksa-admin-binding
subjects:
- kind: ServiceAccount
  name: ray-ksa
  namespace: ray
roleRef:
  kind: ClusterRole
  name: cluster-admin # Only for testing, should use a more restrictive role in prod
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-tpu-v6e-cluster
  namespace: ray
spec:
  headGroupSpec:
    rayStartParams: {}
    template:
      metadata:
        annotations:
          gke-gcsfuse/volumes: "true"
      spec:
        serviceAccountName: ray-ksa
        tolerations:
        - key: "google.com/tpu"
          value: "present"
          effect: "NoSchedule"
        nodeSelector:
          cloud.google.com/gke-nodepool: tpu-v6e-spot
        initContainers:
          - name: download-model
            image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
            command: ["/bin/bash", "-c"]
            args:
              - |
                mkdir -p /data/assets/hf/Qwen3-0.6B
                mkdir -p /data/jialei
                gcloud storage cp -r gs://rl-linglinll-gke-dev/models/Qwen3-0.6B/* /data/assets/hf/Qwen3-0.6B/
                echo "Model downloaded successfully"
                ls -la /data/assets/hf/Qwen3-0.6B/
            volumeMounts:
            - name: model-volume
              mountPath: /data
        containers:
          - name: ray-head
            image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-ray:vllm-0612
            imagePullPolicy: Always
            env:
            - name: RAY_TRAIN_V2_ENABLED
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_token
                  optional: true
            ports:
              - containerPort: 8265  # Dashboard
              - containerPort: 10001 # Client
              - containerPort: 8888  # gRPC
              - containerPort: 8000  # OpenAI API
            resources:
              limits:
                cpu: "12"
                memory: "48Gi"
              requests:
                cpu: "8"
                memory: "32Gi"
            volumeMounts:
            - name: model-volume
              mountPath: /data
        volumes:
        - name: model-volume
          emptyDir:
            sizeLimit: 50Gi
  workerGroupSpecs:
    - replicas: 1 # 1 trainer worker pod
      numOfHosts: 1
      groupName: trainer-group
      rayStartParams: {}
      template:
        metadata:
          annotations:
            gke-gcsfuse/volumes: "true"
        spec:
          serviceAccountName: ray-ksa
          tolerations:
          - key: "google.com/tpu"
            value: "present"
            effect: "NoSchedule"
          nodeSelector:
            cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
            cloud.google.com/gke-tpu-topology: 2x4
            cloud.google.com/gke-accelerator-count: "8"
            cloud.google.com/gke-nodepool: tpu-v6e-spot
          initContainers:
            - name: download-model
              image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
              command: ["/bin/bash", "-c"]
              args:
                - |
                  mkdir -p /data/assets/hf/Qwen3-0.6B
                  mkdir -p /data/jialei
                  gcloud storage cp -r gs://rl-linglinll-gke-dev/models/Qwen3-0.6B/* /data/assets/hf/Qwen3-0.6B/
                  echo "Model downloaded successfully"
                  ls -la /data/assets/hf/Qwen3-0.6B/
              volumeMounts:
              - name: model-volume
                mountPath: /data
          containers:
            - name: ray-worker
              image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-ray:vllm-0612
              imagePullPolicy: Always
              resources:
                limits:
                  memory: "200Gi"
                  google.com/tpu: "8"
                requests:
                  cpu: "48"
                  memory: "200Gi"
                  google.com/tpu: "8"
              env:
                - name: RAY_TRAIN_V2_ENABLED
                  value: "1"
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-secret
                      key: hf_token
                      optional: true
              volumeMounts:
              - name: model-volume
                mountPath: /data
          volumes:
          - name: model-volume
            emptyDir:
              sizeLimit: 50Gi
    - replicas: 1 # 1 generator worker pod
      numOfHosts: 1
      groupName: generator-group
      rayStartParams: {}
      template:
        metadata:
          annotations:
            gke-gcsfuse/volumes: "true"
        spec:
          serviceAccountName: ray-ksa
          tolerations:
          - key: "google.com/tpu"
            value: "present"
            effect: "NoSchedule"
          initContainers:
            - name: download-model
              image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
              command: ["/bin/bash", "-c"]
              args:
                - |
                  mkdir -p /data/assets/hf/Qwen3-0.6B
                  mkdir -p /data/jialei
                  gcloud storage cp -r gs://rl-linglinll-gke-dev/models/Qwen3-0.6B/* /data/assets/hf/Qwen3-0.6B/
                  echo "Model downloaded successfully"
                  ls -la /data/assets/hf/Qwen3-0.6B/
              volumeMounts:
              - name: model-volume
                mountPath: /data
          containers:
            - name: ray-worker
              image: us-central1-docker.pkg.dev/linglinll-gke-dev/test/torchtitan-ray:vllm-0612
              imagePullPolicy: Always
              resources:
                limits:
                  memory: "200Gi"
                  google.com/tpu: "8"
                requests:
                  cpu: "48"
                  memory: "200Gi"
                  google.com/tpu: "8"
              env:
                - name: RAY_TRAIN_V2_ENABLED
                  value: "1"
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-secret
                      key: hf_token
                      optional: true
              volumeMounts:
              - name: model-volume
                mountPath: /data
          volumes:
          - name: model-volume
            emptyDir:
              sizeLimit: 50Gi
          nodeSelector:
            cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
            cloud.google.com/gke-tpu-topology: 2x4
            cloud.google.com/gke-accelerator-count: "8"
            cloud.google.com/gke-nodepool: tpu-v6e-generator
